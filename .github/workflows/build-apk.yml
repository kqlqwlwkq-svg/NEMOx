
name: Build ZYVORA Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools'

      - name: Install Required Android SDK Packages
        shell: bash
        run: |
          sdkmanager "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Verify Android SDK Licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Ensure Gradle Wrapper is Executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Local Debug Keystore
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -noprompt \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
            fi
          fi

      - name: Restore Firebase Configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "app/google-services.json already present."
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          import sys

          EXPECTED_PACKAGE = "com.aistudio.nemoxhub.k7m2vx"

          raw = os.environ.get("GOOGLE_SERVICES_JSON", "").lstrip("\ufeff").strip()
          if not raw:
              print("Error: app/google-services.json is missing and GitHub Secret GOOGLE_SERVICES_JSON is not set.", file=sys.stderr)
              sys.exit(1)

          try:
              data = json.loads(raw)
          except Exception:
              print("Error: GOOGLE_SERVICES_JSON does not contain valid JSON.", file=sys.stderr)
              sys.exit(1)

          if not isinstance(data, dict):
              print("Error: GOOGLE_SERVICES_JSON root must be a JSON object.", file=sys.stderr)
              sys.exit(1)

          project_info = data.get("project_info")
          clients = data.get("client")
          if (
              not isinstance(project_info, dict)
              or not str(project_info.get("project_id", "")).strip()
              or not str(project_info.get("project_number", "")).strip()
          ):
              print("Error: GOOGLE_SERVICES_JSON is missing required project_info fields.", file=sys.stderr)
              sys.exit(1)

          if not isinstance(clients, list) or len(clients) == 0:
              print("Error: GOOGLE_SERVICES_JSON is missing required client entries.", file=sys.stderr)
              sys.exit(1)

          matched_client = None
          for client in clients:
              if not isinstance(client, dict):
                  continue
              client_info = client.get("client_info") or {}
              android_info = client_info.get("android_client_info") or {}
              if (
                  isinstance(client_info, dict)
                  and isinstance(android_info, dict)
                  and android_info.get("package_name") == EXPECTED_PACKAGE
              ):
                  matched_client = client
                  break

          if matched_client is None:
              print(f"Error: No Firebase client matches package_name {EXPECTED_PACKAGE}.", file=sys.stderr)
              sys.exit(1)

          client_info = matched_client.get("client_info") or {}
          if not str(client_info.get("mobilesdk_app_id", "")).strip():
              print("Error: Matching client is missing mobilesdk_app_id.", file=sys.stderr)
              sys.exit(1)

          api_keys = matched_client.get("api_key") or []
          has_current_key = isinstance(api_keys, list) and any(
              isinstance(k, dict) and isinstance(k.get("current_key"), str) and k.get("current_key").strip() != ""
              for k in api_keys
          )
          if not has_current_key:
              print("Error: Matching client is missing a non-empty current_key in api_key.", file=sys.stderr)
              sys.exit(1)

          oauth_clients = matched_client.get("oauth_client") or []
          has_web_oauth_client = isinstance(oauth_clients, list) and any(
              isinstance(oc, dict)
              and oc.get("client_type") == 3
              and isinstance(oc.get("client_id"), str)
              and oc.get("client_id").strip() != ""
              for oc in oauth_clients
          )
          if not has_web_oauth_client:
              print("Error: Matching client is missing oauth_client with client_type = 3 and non-empty client_id.", file=sys.stderr)
              sys.exit(1)

          os.makedirs("app", exist_ok=True)
          with open("app/google-services.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          print("Restored app/google-services.json successfully (JSON, package_name, api_key.current_key, and Web oauth_client verified).")
          PY

      - name: Build Debug APK
        shell: bash
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify Generated APK Exists
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected Debug APK not found at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Inspect APK Signing Certificate (Temporary)
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "Error: apksigner not found under $SDK_ROOT/build-tools"
            exit 1
          fi
          CERT_INFO="$("$APKSIGNER" verify --print-certs "$APK_PATH")"
          echo "$CERT_INFO" | grep -E 'Signer #[0-9]+ certificate (DN|SHA-256 digest|SHA-1 digest):'

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zyvora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
